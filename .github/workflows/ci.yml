name: CI/CD

# CI: runs on every pull request, every push to main and every version tag.
#     Merge only when "CI passed" is green (see "CI/CD" in the README).
#     A pull request that only changes documentation (*.md, docs/) skips the build, the tests
#     and the container jobs; "CI passed" still reports, so it can stay a required check.
# CD: after CI passed on main or on a v* tag, the service images are published to GHCR.
#     Pull requests never publish anything.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

# A new push to a pull request cancels the run that is still going for the previous one. Runs on
# main and on tags are never cancelled while they run: a merge right after another must not stop
# the earlier one from publishing its images (the newest queued run replaces older queued ones).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # ── Does this change touch anything that is built, tested or deployed? ───────────────────
  # Documentation-only pull requests skip the heavy jobs below. Everything else, and every run
  # that is not a pull request (main, tags, manual), runs the full pipeline. The jobs that are
  # skipped count as passed in "CI passed", so branch protection keeps working.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: running everything."
            exit 0
          fi
          # what the pull request changes relative to its base
          files=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$files"
          # anything that is not Markdown, docs/ or the licence counts as a code change
          if [ -z "$files" ] || grep -qvE '\.md$|^docs/|^LICENSE$' <<< "$files"; then
            code=true
          else
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "### Change detection" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "true" ]; then
            echo "Code, configuration or deployment files changed: full pipeline." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Documentation only: build, tests and container jobs skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Build + every test, including the ones that need PostgreSQL and RabbitMQ ─────────────
  build-and-test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Plain RabbitMQ on purpose: the application must not need the management plugin
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 10

    env:
      # Picked up by src/Tests/ShopEasy.UnitTests/Infrastructure (see README "Testing")
      SHOPEASY_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
      SHOPEASY_TEST_RABBITMQ: amqp://test:test@localhost:5672

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # CI=true (set by GitHub Actions) turns NuGet vulnerability warnings into errors,
      # see Directory.Build.props — a vulnerable dependency fails right here.
      - name: Restore
        run: dotnet restore ShopEasy.sln

      - name: Build
        run: dotnet build ShopEasy.sln --configuration Release --no-restore

      # The test host has stalled on CI before (every thread idle, no test finishing) and is
      # only aborted after 5 minutes of silence, which says nothing about why. A healthy run takes
      # about two minutes, so a test host still alive after 200 s is stuck or very slow: record
      # where every thread is, twice, for the step after this one to print.
      - name: Test
        run: |
          mkdir -p TestResults
          dotnet tool install dotnet-stack --version 10.0.750501 --tool-path "$RUNNER_TEMP/tools" \
            || echo "::warning::dotnet-stack could not be installed; a stalled run will not show its stacks"
          (
            sleep 200
            for _ in 1 2; do
              for pid in $(pgrep -f testhost.dll); do "$RUNNER_TEMP/tools/dotnet-stack" report -p "$pid" || true; done
              echo "---- $(date -u +%T) ----"
              sleep 60
            done
          ) > TestResults/stall-stacks.txt 2>&1 &
          watcher=$!
          status=0
          dotnet test src/Tests/ShopEasy.UnitTests \
            --configuration Release --no-build \
            --blame-hang-timeout 5m --blame-hang-dump-type none \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory TestResults || status=$?
          kill "$watcher" 2>/dev/null || true
          exit $status

      # Which tests had started and not finished (written when blame aborts the run), and the
      # thread stacks recorded above. Nothing is printed when the run was not stalled.
      - name: Show where a stalled run was stuck
        if: failure()
        run: |
          for f in TestResults/*/Sequence_*.xml TestResults/stall-stacks.txt; do
            test -s "$f" || continue
            echo "::group::$f"
            grep -v 'Completed="True"' "$f"
            echo "::endgroup::"
          done

      # The PostgreSQL/RabbitMQ tests skip themselves when their server is not configured.
      # That is right on a laptop but must never happen here: a mis-wired service container
      # would otherwise turn 20 tests into silent no-ops and still show green.
      - name: Fail if any test was skipped
        if: always()
        run: |
          trx=TestResults/unit-tests.trx
          test -f "$trx" || { echo "::error::No test results were produced"; exit 1; }
          counters=$(grep -o '<Counters [^>]*>' "$trx" | head -1)
          echo "$counters"
          echo "### Unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$counters\`" >> "$GITHUB_STEP_SUMMARY"
          skipped=$(grep -c 'outcome="NotExecuted"' "$trx" || true)
          if [ "$skipped" != "0" ]; then
            echo "::error::$skipped test(s) were skipped. The PostgreSQL/RabbitMQ service containers are not wired correctly."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          retention-days: 14

  # ── The Compose file and the Kubernetes manifests must stay valid ────────────────────────
  validate-deployment-files:
    name: Validate Compose and Kubernetes files
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The image build stays green with a wrong .NET version, but a net8.0 app cannot start on a
      # .NET 10 runtime image. This turns "Dependabot bumped the base image" into a red check.
      - name: Dockerfile base images match the target framework
        run: bash .github/scripts/check-dockerfile-frameworks.sh

      # .env.example documents every required variable; if the Compose file starts
      # needing a new one that is missing from the example, this fails.
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config --quiet

      # The cluster gets what `kubectl kustomize` renders (images and their pinned tags come from
      # k8s/kustomization.yaml), so that is what is validated, together with the secrets template.
      - name: kubeconform (rendered Kubernetes manifests)
        run: |
          kubectl kustomize k8s > "$RUNNER_TEMP/k8s-rendered.yaml"
          docker run --rm \
            -v "$RUNNER_TEMP:/rendered:ro" -v "$PWD/k8s/secrets:/secrets:ro" \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas /rendered/k8s-rendered.yaml /secrets

      # The Prometheus configuration must be valid together with the alert rules, and the rules must
      # fire (and stay quiet) on the series in prometheus-rules.test.yml.
      - name: Prometheus configuration and alert rules (promtool)
        run: |
          for check in "check config prometheus.yml" "test rules prometheus-rules.test.yml"; do
            docker run --rm --entrypoint promtool -v "$PWD:/work:ro" -w /work prom/prometheus:v2.51.0 $check
          done

      # kubeconform says the YAML is valid; this says it is safe: images pinned to a commit, no
      # root, read-only root file system, no capabilities, ingress denied by default.
      - name: Kubernetes deployment rules
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/check-k8s-manifests.py < "$RUNNER_TEMP/k8s-rendered.yaml"

  # ── Every image must build AND the stack must actually start ─────────────────────────────
  # This builds all six service images (so it is also the "does every Dockerfile build" check;
  # nothing is pushed from a pull request, images are built and published from main) and starts
  # them: an image that builds can still fail to run.
  # The .NET 10 base-image incident built fine and crashed on start. This starts the real
  # containers, hardened exactly as in production (non-root, read-only file system, no
  # capabilities), waits for every health check, and then has a customer sign up and buy something
  # through the gateway (the end-to-end test), which only works when every service, the broker and
  # the databases work together.
  container-smoke-test:
    name: Compose stack and end-to-end test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # .env.example holds throw-away values ("change-me-…"): fine for a runner that is discarded
      - name: Configuration
        run: cp .env.example .env

      # Only the services of the application; the monitoring tools (Grafana, Seq, Jaeger, ...) do
      # not affect whether the application starts.
      - name: Build the images and start the services
        run: >-
          docker compose up -d --build --wait --wait-timeout 900
          postgres rabbitmq redis identity product inventory payment order gateway

      - name: Containers run unprivileged
        run: bash .github/scripts/check-running-containers.sh

      - name: Identity serves its signing key (generated into and read from PostgreSQL)
        run: |
          curl --fail --silent --show-error --max-time 90 \
            http://localhost:5001/.well-known/openid-configuration/jwks | tee "$RUNNER_TEMP/jwks.json"
          grep -q '"kid"' "$RUNNER_TEMP/jwks.json"

      - name: Gateway is up
        run: |
          curl --fail --silent --show-error http://localhost:5000/health
          echo

      # The system as a customer uses it: sign up, sign in through the gateway, place an order and
      # wait for the saga to confirm it. Compose starts the payment provider in "always succeeds"
      # mode, so a failure here is a broken system, not a declined payment.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: End-to-end test (a customer signs up, signs in and buys)
        run: >-
          dotnet test src/Tests/ShopEasy.EndToEndTests
          --configuration Release
          --blame-hang-timeout 5m --blame-hang-dump-type none
          --logger "trx;LogFileName=end-to-end.trx"
          --results-directory TestResults/end-to-end

      - name: Upload end-to-end results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: end-to-end-results
          path: TestResults/end-to-end/
          if-no-files-found: ignore
          retention-days: 14

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 150

      - name: Stop
        if: always()
        run: docker compose down --volumes

  # ── Single status to require in branch protection ────────────────────────────────────────
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, build-and-test, validate-deployment-files, container-smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded?
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::A required job failed or was cancelled"
            exit 1
          fi

  # ── CD: publish the service images to the GitHub Container Registry ─────────────────────
  # Only after every CI job passed, only from main or a version tag, never from a pull request.
  # Authenticates with the built-in GITHUB_TOKEN: no secret needs to be created.
  # Images: ghcr.io/<owner>/shopeasy-<service>:{sha-<short>, latest (main only), <version> (tags)}
  publish-images:
    name: Publish image (${{ matrix.service }})
    needs: [ci-passed]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: identity,  dockerfile: src/Identity/ShopEasy.Identity/Dockerfile }
          - { service: gateway,   dockerfile: src/Gateway/ShopEasy.Gateway/Dockerfile }
          - { service: product,   dockerfile: src/Services/ShopEasy.ProductService/Dockerfile }
          - { service: inventory, dockerfile: src/Services/ShopEasy.InventoryService/Dockerfile }
          - { service: payment,   dockerfile: src/Services/ShopEasy.PaymentService/Dockerfile }
          - { service: order,     dockerfile: src/Services/ShopEasy.OrderService/Dockerfile }
    steps:
      - uses: actions/checkout@v7

      # Registry paths must be lowercase; the GitHub owner name may not be
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shopeasy-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
